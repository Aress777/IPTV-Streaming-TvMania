name: Build TvMania APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Create release configuration
        run: |
          cat > local.properties <<'EOF'
          NUVIO_SUPABASE_URL=https://api.nuvio.tv
          NUVIO_SUPABASE_ANON_KEY=sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN
          TV_LOGIN_WEB_BASE_URL=https://nuvio.tv/tv-login
          TRAKT_CLIENT_ID=${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET=${{ secrets.TRAKT_CLIENT_SECRET }}
          CI_USE_DEBUG_SIGNING=true
          EOF
      - name: Create CI debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore nuviotv.jks \
            -storepass 815787 \
            -alias nuviotv \
            -keypass 815787 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=TvMania CI, OU=Android TV, O=TvMania, L=Bucharest, C=RO"
      - name: Build release APK
        run: ./gradlew :app:assembleFullRelease --stacktrace
      - uses: actions/upload-artifact@v6
        with:
          name: tvmania-apk
          path: app/build/outputs/apk/full/release/*.apk
          if-no-files-found: error
          retention-days: 14
